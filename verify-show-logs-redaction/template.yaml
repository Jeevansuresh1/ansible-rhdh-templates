apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: verify-show-logs-redaction
  title: Verify Show Logs redaction
  description: >
    Creates a short-lived AAP project and job template, launches a localhost
    playbook that emits intentional FAKE secrets via ansible.builtin.debug,
    then cleans up. Use with the AAP-89098 plugins build to confirm playbook
    stdout is redacted in scaffolder Show Logs.
  namespace: default
  annotations:
    ansible.com/template-source: scm
  tags:
    - aap-operations
    - intermediate

spec:
  owner: RedHat
  type: service

  parameters:
    - title: Project data
      description: Provide project data
      required:
        - token
        - organization
        - scmUrl
        - playbook
      properties:
        token:
          title: Token
          type: string
          description: Oauth2 token
          ui:field: AAPTokenField
          ui:backstage:
            review:
              show: false
        scmType:
          title: Select source control option
          type: string
          description: Select the source control option for your Ansible project.
          default: Github
          enum:
            - Github
            - Gitlab
        organization:
          title: Organization
          description: Select organization
          resource: organizations
          ui:field: AAPResourcePicker
          default:
            id: 1
            name: Default
        jobInventory:
          title: Inventory
          description: Select inventory
          resource: inventories
          ui:field: AAPResourcePicker
          default:
            id: 1
            name: Default
        credentials:
          title: Credentials
          description: Select SCM credential for Private repositories
          resource: credentials
          ui:field: AAPResourcePicker
        scmUrl:
          title: Source control URL
          type: string
          ui:help: 'Source control URL: gitSourceControlUrlHelp'
          ui:options:
            rows: 5
          default: https://github.com/Jeevansuresh1/ansible-rhdh-templates
        scmBranch:
          title: Source control branch/tag/commit
          type: string
          ui:options:
            rows: 5
          default: verify-show-logs-redaction-aap-89098
          ui:help: 'Branch to checkout. In addition to branches, you can input tags, commit hashes, and arbitrary refs.'
        playbook:
          title: Playbook
          description: Playbook path in the source control repository
          type: string
          ui:options:
            rows: 5
          default: verify-show-logs-redaction/site.yml

  steps:
    - id: create-project
      name: Create project
      action: rhaap:create-project
      input:
        token: ${{ secrets.aapToken }}
        deleteIfExist: true
        values:
          projectName: 'Verify Show Logs Redaction Project'
          projectDescription: 'Verify Show Logs Redaction Project'
          organization: ${{ parameters.organization }}
          scmUrl: ${{ parameters.scmUrl }}
          scmBranch: ${{ parameters.scmBranch }}
          scmUpdateOnLaunch: true
          credentials: ${{ parameters.credentials }}

    - id: create-ee
      name: Create execution environment
      action: rhaap:create-execution-environment
      input:
        token: ${{ secrets.aapToken }}
        deleteIfExist: true
        values:
          environmentName: 'Verify Show Logs Redaction EE'
          organization: ${{ parameters.organization }}
          image: 'quay.io/ansible/awx-ee:latest'
          pull: always

    - id: create-template
      name: Create job template
      action: rhaap:create-job-template
      input:
        token: ${{ secrets.aapToken }}
        deleteIfExist: true
        values:
          templateName: 'Verify Show Logs Redaction'
          templateDescription: 'Verify Show Logs Redaction'
          scmType: ${{ parameters.scmType }}
          # Rebuild portal-shaped objects; AAP create outputs use Controller API shapes.
          project:
            id: ${{ steps['create-project'].output.project.id }}
            projectName: 'Verify Show Logs Redaction Project'
            organization: ${{ parameters.organization }}
            scmUrl: ${{ parameters.scmUrl }}
            scmBranch: ${{ parameters.scmBranch }}
            scmUpdateOnLaunch: true
            credentials: ${{ parameters.credentials }}
          organization: ${{ parameters.organization }}
          jobInventory: ${{ parameters.jobInventory }}
          playbook: ${{ parameters.playbook }}
          executionEnvironment:
            id: ${{ steps['create-ee'].output.executionEnvironment.id }}
            environmentName: 'Verify Show Logs Redaction EE'
            organization: ${{ parameters.organization }}
            image: 'quay.io/ansible/awx-ee:latest'
            pull: always
          credentials: ${{ parameters.credentials }}

    - id: launch-job
      name: Launch job template
      action: rhaap:launch-job-template
      input:
        token: ${{ secrets.aapToken }}
        values:
          template: 'Verify Show Logs Redaction'

    - id: clean-up
      name: Clean up
      action: rhaap:clean-up
      input:
        token: ${{ secrets.aapToken }}
        values:
          project:
            id: ${{ steps['create-project'].output.project.id }}
            projectName: 'Verify Show Logs Redaction Project'
            organization: ${{ parameters.organization }}
            scmUrl: ${{ parameters.scmUrl }}
          executionEnvironment:
            id: ${{ steps['create-ee'].output.executionEnvironment.id }}
            environmentName: 'Verify Show Logs Redaction EE'
            organization: ${{ parameters.organization }}
            image: 'quay.io/ansible/awx-ee:latest'
            pull: always
          template:
            id: ${{ steps['create-template'].output.template.id }}
            templateName: 'Verify Show Logs Redaction'
            organization: ${{ parameters.organization }}
            jobInventory: ${{ parameters.jobInventory }}
            playbook: ${{ parameters.playbook }}
            project:
              id: ${{ steps['create-project'].output.project.id }}
              projectName: 'Verify Show Logs Redaction Project'
              organization: ${{ parameters.organization }}
              scmUrl: ${{ parameters.scmUrl }}

  output:
    text:
      - title: 'Verify Show Logs redaction executed successfully'
        content: |
          **Job ID:** `${{ steps['launch-job'].output.data.id }}`

          Open **Show Logs** → **launch-job**. After `Job … completed with status: successful`,
          search for `SHOW_LOGS_CHECK` (AAP-89098 plugins build only):
          - `SHOW_LOGS_CHECK safe=Hello from verify-show-logs-redaction`
          - `SHOW_LOGS_CHECK password=[REDACTED]`
          - `SHOW_LOGS_CHECK access_token=[REDACTED]`
          - `SHOW_LOGS_CHECK refresh_token=[REDACTED]`
          - JSON keys redacted to `[REDACTED]`
          - `SHOW_LOGS_CHECK step ] completed` and `SHOW_LOGS_CHECK next`

          On plain `main` (without that PR), those `SHOW_LOGS_CHECK` playbook lines will not appear.
    links:
      - title: View in RH AAP
        url: ${{ steps['launch-job'].output.data.url }}
