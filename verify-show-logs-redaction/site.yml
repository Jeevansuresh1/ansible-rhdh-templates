---
# Intentional FAKE secrets only — for AAP-89098 Show Logs redaction checks.
# Each debug msg is prefixed with SHOW_LOGS_CHECK so it is easy to find in
# scaffolder Show Logs (launch-job step), after "Job … completed".
- name: Verify Show Logs redaction
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Marker start
      ansible.builtin.debug:
        msg: 'SHOW_LOGS_CHECK start verify-show-logs-redaction'

    - name: Safe baseline message
      ansible.builtin.debug:
        msg: 'SHOW_LOGS_CHECK safe=Hello from verify-show-logs-redaction'

    - name: Password assignment style
      ansible.builtin.debug:
        msg: 'SHOW_LOGS_CHECK password=SuperSecret123'

    - name: Access token assignment style
      ansible.builtin.debug:
        msg: 'SHOW_LOGS_CHECK access_token=supersecret'

    - name: Refresh token assignment style
      ansible.builtin.debug:
        msg: 'SHOW_LOGS_CHECK refresh_token=supersecret'

    - name: Quoted JSON-like sensitive fields
      ansible.builtin.debug:
        msg: 'SHOW_LOGS_CHECK {"password":"secret","token":"abc123","access_token":"atk","refresh_token":"rtk"}'

    - name: Array msg with closing bracket inside an item
      ansible.builtin.debug:
        msg:
          - 'SHOW_LOGS_CHECK step ] completed'
          - 'SHOW_LOGS_CHECK next'

    - name: Marker end
      ansible.builtin.debug:
        msg: 'SHOW_LOGS_CHECK end verify-show-logs-redaction'
